  .eyebrow { color: var(--gold); letter-spacing: .2em; font-size: 11px; }
  h1 { font-size: clamp(34px, 9vw, 64px); line-height: .98; margin: 14px 0 16px; letter-spacing: -.03em; }
  p { color: var(--dim); }
  a { display: inline-block; margin-top: 14px; padding: 12px 16px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-size: 12px; letter-spacing: .12em; }
